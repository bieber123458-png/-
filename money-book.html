<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>我的記帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF2F5">
<link rel="icon" id="appIcon" href="">
<link rel="apple-touch-icon" id="appTouchIcon" href="money-book-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 版面：單欄手機 App，底部分頁列 + 浮動記帳鈕；摩蘭迪寶寶藍、思源粗體、吉祥物「肉包」 */
:root{
  --bg:#EEF2F5; --card:#FBFCFD; --ink:#3E4A57; --muted:#8C98A4; --line:#DDE4EA;
  --accent:#8FAAC3; --accent-deep:#6F8CA8; --accent-soft:#E2EAF1; --on-accent:#FFFFFF;
  --exp:#C48E8E; --exp-soft:#F4E7E7; --inc:#86A797; --inc-soft:#E3EEE8;
  --warn:#C2A273; --warn-soft:#F4EDE1;
  --mascot:#AFC6DA; --mascot-ear:#97B3CB; --blush:#EEC5C5; --eye:#3E4A57;
  --face:#FCFDFE; --r-n:#A9B7C4; --r-r:#93B8B2; --r-sr:#AFA2C6; --r-ssr:#CDB48A;
  --radius:20px; --shadow:0 6px 20px rgba(80,110,140,.10);
  --font:'Noto Sans TC','Source Han Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-d:var(--font);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E242B; --card:#28303A; --ink:#E6ECF1; --muted:#93A0AD; --line:#36404B;
    --accent:#A9C1D6; --accent-deep:#BFD2E2; --accent-soft:#33404D; --on-accent:#1E242B;
    --exp:#D9A3A3; --exp-soft:#3E2F33; --inc:#A3C2B3; --inc-soft:#2A3A35;
    --warn:#D8BC90; --warn-soft:#3D3628;
    --mascot:#9DB8CF; --mascot-ear:#87A5BF; --blush:#D9A9A9;
    --face:#2C3540;
    --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E242B; --card:#28303A; --ink:#E6ECF1; --muted:#93A0AD; --line:#36404B;
  --accent:#A9C1D6; --accent-deep:#BFD2E2; --accent-soft:#33404D; --on-accent:#1E242B;
  --exp:#D9A3A3; --exp-soft:#3E2F33; --inc:#A3C2B3; --inc-soft:#2A3A35;
  --warn:#D8BC90; --warn-soft:#3D3628;
  --mascot:#9DB8CF; --mascot-ear:#87A5BF; --blush:#D9A9A9;
  --face:#2C3540;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);font-weight:700;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
input,select,textarea{font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);font-size:13px;}
.hidden{display:none !important;}
.exp-c{color:var(--exp);} .inc-c{color:var(--inc);}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 4px;}
.top h1{font-family:var(--font-d);font-size:24px;font-weight:900;margin:0;letter-spacing:.04em;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--card);box-shadow:var(--shadow);}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.month-nav button.m{font-size:17px;font-weight:700;padding:6px 12px;border-radius:10px;}
.month-nav .icon-btn{width:34px;height:34px;}

/* shared blocks */
.section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px;}
.section h2{font-size:15px;margin:0 0 12px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px;}
.sec-head h2{font-size:15px;margin:0;}
.sec-head .add{font-size:13px;font-weight:700;color:var(--accent);padding:4px 8px;}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-top:12px;}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);}
.seg button.on{background:var(--accent);color:var(--on-accent);}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.bar i.over{background:var(--exp);} .bar i.good{background:var(--inc);}
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--ink);}
.btn.primary{background:var(--accent);color:var(--on-accent);}
.btn.danger{background:var(--exp-soft);color:var(--exp);}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px;}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;}
.st.good{background:var(--inc-soft);color:var(--inc);} .st.ok{background:var(--warn-soft);color:var(--warn);}
.st.warn{background:var(--exp-soft);color:var(--exp);} .st.info{background:var(--accent-soft);color:var(--ink);}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;line-height:1.8;}
.empty .big{font-size:40px;}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex:none;}

/* summary */
.summary{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:12px;}
.summary .label{font-size:13px;color:var(--muted);}
.summary .big-v{font-family:var(--font-d);font-size:34px;font-weight:900;margin:2px 0 12px;}
.pills{display:flex;gap:10px;}
.pill{flex:1;border-radius:12px;padding:10px 12px;min-width:0;}
.pill.exp{background:var(--exp-soft);} .pill.inc{background:var(--inc-soft);}
.pill .label{font-size:12px;} .pill .v{font-weight:700;font-size:17px;}
.pill.exp .v{color:var(--exp);} .pill.inc .v{color:var(--inc);}
.budget{margin-top:14px;}
.budget .bar{margin-top:6px;}
.budget .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}

/* list rows */
.search{width:100%;margin-top:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);}
.day{margin-top:16px;}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.main{flex:1;min-width:0;}
.main .t{font-weight:700;font-size:15px;}
.main .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.amt{font-weight:700;font-size:16px;white-space:nowrap;}
.amt.exp{color:var(--exp);} .amt.inc{color:var(--inc);} .amt.tr{color:var(--muted);}

/* stats */
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut-wrap svg{flex:none;}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;}
.legend div{display:flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank{display:flex;flex-direction:column;gap:12px;}
.rank .r{display:flex;align-items:center;gap:10px;}
.rank .ri{font-size:20px;width:28px;text-align:center;}
.rank .b{flex:1;min-width:0;}
.rank .top2{display:flex;justify-content:space-between;font-size:14px;}
.rank .bar{height:6px;margin-top:5px;}
.chart svg{width:100%;height:auto;display:block;}

/* mascot + greeting */
.mascot svg,.mascot img{display:block;}
.pet{object-fit:contain;filter:drop-shadow(0 4px 6px rgba(60,80,100,.25));-webkit-user-select:none;user-select:none;}
.cback .ring .pet{filter:drop-shadow(0 6px 10px rgba(30,50,70,.3));}
.greet{display:flex;align-items:flex-end;gap:10px;margin-top:10px;}
.greet .mascot{flex:none;animation:bob 3.2s ease-in-out infinite;}
.bubble{position:relative;background:var(--card);border-radius:16px 16px 16px 4px;padding:9px 13px;box-shadow:var(--shadow);font-family:var(--font-d);font-size:14px;line-height:1.5;min-width:0;}
.bubble small{display:block;font-family:var(--font);font-size:12px;color:var(--muted);}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* daily card widget */
.daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:14px;padding:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--accent-soft),var(--card));box-shadow:var(--shadow);}
.daily .mini-back{width:46px;height:64px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45) 0 6%,transparent 7%),linear-gradient(150deg,var(--mascot),var(--accent-deep));box-shadow:0 4px 10px rgba(111,140,168,.35);}
.daily.ready .mini-back{animation:wiggle 1.6s ease-in-out infinite;}
.daily.locked .mini-back{filter:grayscale(.5);opacity:.6;}
.daily .mini-face{width:46px;height:64px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:26px;background:var(--face);border:2px solid var(--rc,var(--r-n));}
.daily .tx1{font-family:var(--font-d);font-size:16px;}
.daily .tx2{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
.daily .go{margin-left:auto;flex:none;}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}}

/* draw overlay */
.draw-ov{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  background:rgba(40,55,70,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow-y:auto;}
.draw-ov .hint{color:#fff;font-family:var(--font-d);font-size:16px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.25);}
.flip{perspective:1200px;width:min(310px,86vw);}
.flip-in{display:grid;transition:transform .9s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;}
.flip-in.flipped{transform:rotateY(180deg);}
.flip-in > *{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.flip-in .tcard{transform:rotateY(180deg);}
.flip.idle .flip-in{animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.cback{border-radius:22px;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;color:#fff;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.5px,transparent 2px) 0 0/18px 18px,linear-gradient(155deg,#B7CCDD,#8FAAC3 55%,#7896B3);
  box-shadow:0 18px 40px rgba(30,50,70,.35),inset 0 0 0 8px rgba(255,255,255,.25);font-family:var(--font-d);}
.cback .ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 0 12px rgba(255,255,255,.12);}
.cback .t{font-size:20px;letter-spacing:.2em;}
.cback .s{font-size:13px;opacity:.85;letter-spacing:.1em;}
.tcard{border-radius:22px;background:var(--face);color:var(--ink);padding:16px 18px 18px;box-shadow:0 18px 40px rgba(30,50,70,.35),inset 0 0 0 3px var(--rc);min-height:440px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.tcard.SSR{box-shadow:0 18px 40px rgba(30,50,70,.35),inset 0 0 0 3px var(--rc),0 0 30px rgba(205,180,138,.6);}
.tcard.SSR::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s ease-in-out infinite;}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.tc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);}
.rar{font-weight:700;color:#fff;background:var(--rc);padding:3px 10px;border-radius:99px;letter-spacing:.05em;}
.tc-art{position:relative;height:120px;border-radius:16px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 65%),var(--accent-soft);}
.tc-art .em{font-size:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));animation:bob 3s ease-in-out infinite;}
.tc-art .sp{position:absolute;color:var(--rc);font-size:14px;animation:twinkle 2.4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tc-title{font-family:var(--font-d);font-size:22px;font-weight:900;text-align:center;letter-spacing:.06em;}
.tc-msg{font-family:var(--font-d);font-size:15px;line-height:1.75;margin:0;text-align:center;}
.tc-read{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7;}
.tc-read b{display:block;font-size:12px;color:var(--accent-deep);margin-bottom:2px;letter-spacing:.1em;}
.tc-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;}
.tc-foot i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.08);}
.tc-task{font-size:13px;}
.burst{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:81;}
.burst span{position:absolute;font-size:16px;color:#fff;animation:pop 1s ease-out forwards;}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.draw-ov .acts{display:flex;gap:10px;}
.draw-ov .btn{background:rgba(255,255,255,.9);color:#3E4A57;}
.draw-ov .btn.primary{background:#fff;}

/* album */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mc{aspect-ratio:3/4;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;
  background:var(--face);box-shadow:var(--shadow),inset 0 0 0 2px var(--rc);font-size:12px;text-align:center;}
.mc .e{font-size:30px;}
.mc .n{font-family:var(--font-d);font-size:13px;line-height:1.3;}
.mc .r{font-size:10px;font-weight:700;color:var(--rc);}
.mc.lock{background:var(--accent-soft);box-shadow:none;color:var(--muted);}
.mc.lock .e{font-size:22px;opacity:.5;}
@media (prefers-reduced-motion: reduce){ .greet .mascot,.flip.idle .flip-in,.tc-art .em,.tc-art .sp,.daily.ready .mini-back,.tcard.SSR::after{animation:none !important;} .flip-in{transition:none;} }

/* assets page */
.eq{font-size:13px;color:var(--muted);margin:-6px 0 12px;}
.ratio{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px;}
.ratio i{display:block;height:100%;}
.ratio .a{background:var(--inc);} .ratio .l{background:var(--exp);}
.ratio-meta{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;font-weight:700;}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 4px 8px;}
.block-head h2{font-size:16px;margin:0;}
.block-head b{font-family:var(--font-d);font-size:21px;font-weight:900;}
.block-head .add{font-size:13px;font-weight:700;color:var(--accent);padding:4px 0;}
.comp{padding:14px 14px 4px;}
.comp .ratio{height:12px;}
.comp .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:8px 0 6px;}
.comp .lg span{display:inline-flex;align-items:center;gap:5px;}
.comp .lg i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.add-row{justify-content:center;color:var(--accent);font-weight:700;font-size:14px;}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.ov-grid div{min-width:0;}
.ov-grid .k{font-size:12px;color:var(--muted);}
.ov-grid .v{font-size:16px;font-weight:700;}
.ov-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px;gap:8px;}
.ov-top b{color:var(--ink);font-size:15px;}
.mini{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.mini .r{display:flex;align-items:center;gap:10px;}
.mini .r .e{font-size:18px;width:24px;text-align:center;flex:none;}
.mini .r .b{flex:1;min-width:0;}
.mini .r .top2{display:flex;justify-content:space-between;font-size:13px;gap:8px;}
.mini .r .top2 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .r .bar{height:6px;margin-top:5px;}

/* debts, goals, wishes */
.item{padding:14px;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item .hd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;}
.item .bar{margin-top:10px;}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px;}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.item .right{text-align:right;white-space:nowrap;}
details.done-list{margin-top:14px;}
details.done-list summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px;}

/* diagnosis */
.score{display:flex;align-items:center;gap:16px;}
.score svg{flex:none;}
.score .txt{flex:1;min-width:0;}
.score .txt b{font-size:18px;}
.diag .it{padding:14px 0;border-bottom:1px solid var(--line);}
.diag .it:last-child{border-bottom:none;padding-bottom:0;}
.diag .it:first-child{padding-top:0;}
.diag .it .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.diag .it .hd b{font-size:15px;}
.diag .it .v{font-size:20px;font-weight:900;margin:4px 0 2px;}
.diag .it p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
.set-row:last-child{border-bottom:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:99px;background:var(--accent-soft);font-size:14px;}
.chip .x{color:var(--muted);font-size:13px;padding-left:2px;}
.add-inline{display:flex;gap:8px;margin-top:10px;}
.add-inline input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);}
.add-inline input.emo{flex:0 0 56px;text-align:center;}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20;}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:center;}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:4px 0;gap:2px;}
nav.tabs button .e{font-size:20px;filter:grayscale(.6);opacity:.55;transition:transform .2s;}
nav.tabs button.on{color:var(--ink);font-weight:700;}
nav.tabs button.on .e{filter:none;opacity:1;transform:translateY(-2px) scale(1.08);}
nav.tabs .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;padding:0;flex:none;
  margin:-26px 6px 0;background:linear-gradient(145deg,var(--mascot),var(--accent-deep));box-shadow:0 8px 20px rgba(111,140,168,.45);}
nav.tabs .fab path{stroke:var(--on-accent);}

/* sheets */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));}
.sheet.show{transform:none;visibility:visible;}
#esheet{z-index:52;}
.sheet .in{max-width:560px;margin:0 auto;}
.sheet h3{font-size:17px;margin:0 0 12px;}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px;}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px;}
.sheet-head .grab{margin:0;}
.sheet-head .link{font-size:14px;font-weight:700;color:var(--muted);padding:4px 2px;justify-self:start;}
.sheet-head .del{justify-self:end;color:var(--exp);}
.amt-disp{flex:1;min-width:0;font-family:var(--font-d);font-size:36px;font-weight:900;text-align:right;white-space:nowrap;overflow-x:auto;min-height:46px;line-height:46px;}
.amt-disp.ph{color:var(--muted);}
.amt-disp.exp{color:var(--exp);} .amt-disp.inc{color:var(--inc);}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:50px;gap:6px;margin-top:12px;}
.keypad button{border-radius:12px;background:var(--bg);font-size:22px;font-weight:700;color:var(--ink);transition:transform .08s;}
.keypad button:active{transform:scale(.95);}
.keypad .op{background:var(--accent-soft);font-weight:700;}
.keypad .fn{color:var(--muted);font-size:19px;font-weight:700;}
.keypad .ok{grid-row:span 2;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;}
.type-toggle{display:flex;gap:8px;}
.type-toggle button{flex:1;padding:10px 4px;border-radius:12px;font-weight:700;background:var(--bg);color:var(--muted);}
.type-toggle button.on.exp{background:var(--exp-soft);color:var(--exp);}
.type-toggle button.on.inc{background:var(--inc-soft);color:var(--inc);}
.type-toggle button.on.tr{background:var(--accent-soft);color:var(--ink);}
.amount-box{display:flex;align-items:center;gap:6px;margin:12px 0 2px;border-bottom:2px solid var(--line);padding-bottom:6px;}
.amount-box span{font-size:22px;color:var(--muted);}
.amount-box input{flex:1;min-width:0;border:none;background:none;font-size:34px;font-weight:900;outline:none;}
.calc-hint{font-size:12px;color:var(--muted);min-height:16px;}
.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 2px;}
.cat-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;color:var(--muted);white-space:nowrap;}
.cat-grid button .e{font-size:22px;}
.cat-grid button.on{background:var(--accent-soft);color:var(--ink);font-weight:700;}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-top:6px;}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0;}
.fl.full{grid-column:1 / -1;}
.fl input,.fl select{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);}
.sheet-actions{display:flex;gap:8px;margin-top:16px;}
.sheet-actions .btn{flex:1;padding:14px;font-size:16px;}
.sheet-actions .btn.danger{flex:0 0 auto;}
.dlg-msg{font-size:15px;line-height:1.7;margin:4px 0 0;white-space:pre-line;}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 id="pageTitle">記帳</h1>
    <button class="icon-btn" id="gear" aria-label="設定">⚙️</button>
  </header>
  <div class="month-nav" id="monthNav">

  <!-- 記帳 -->
  <section id="page-list">
    <div class="greet"><span class="mascot" id="greetMascot"></span><div class="bubble" id="greetText"></div></div>

  <!-- 資產 -->
  <section id="page-assets" class="hidden">

      <h2>淨資產走勢（近 6 個月）</h2>
      <div id="nwChart"></div>
    </div>

    <div class="block-head"><h2>總資產</h2><b class="num inc-c" id="totAsset">0</b></div>
    <div class="card">
      <div class="comp" id="assetComp"></div>
      <div id="assetList"></div>
      <button class="row add-row" data-newacct="asset">＋ 新增資產帳戶</button>
    </div>

    <div class="block-head"><h2>總負債</h2><b class="num exp-c" id="totLiab">0</b></div>
    <div class="card">
      <div id="debtList"></div>

    <div class="block-head"><h2>存錢進度</h2><button class="add" id="toGoals">管理目標 ›</button></div>

  <!-- 規劃 -->

      <button data-v="goals" class="on">目標追蹤</button>

  <!-- 設定 -->
  <section id="page-settings" class="hidden">
    <div class="section">
      <h2>每月預算</h2>
      <div class="add-inline" style="margin-top:0">
        <input id="budgetInput" type="number" inputmode="numeric" placeholder="例如 20000（留空＝不設定）">
        <button class="btn primary" id="saveBudget">儲存</button>
      </div>
    </div>
    <div class="section">
      <h2>支出分類</h2>
      <div class="chips" id="catsExpense"></div>
      <div class="add-inline"><input class="emo" id="newExpIcon" placeholder="🍜" maxlength="4"><input id="newExpName" placeholder="新分類名稱"><button class="btn" data-addcat="expense">新增</button></div>
    </div>
    <div class="section">
      <h2>收入分類</h2>
      <div class="chips" id="catsIncome"></div>
      <div class="add-inline"><input class="emo" id="newIncIcon" placeholder="💰" maxlength="4"><input id="newIncName" placeholder="新分類名稱"><button class="btn" data-addcat="income">新增</button></div>
    </div>
    <div class="section">
      <h2>外觀與資料</h2>
      <div class="set-row"><span>主題</span>
        <select id="themeSel" class="btn"><option value="auto">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select>
      </div>
      <div class="set-row"><span>備份資料（JSON）</span><button class="btn" id="exportJson">下載備份</button></div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const KEY = 'moneybook.v1';
const PALETTE = ['#8FAAC3','#D1A7A3','#A3B89C','#D5BC92','#AFA2C6','#93B8B2','#C9AE97','#A0AABF'];
const COOL_DAYS = 30;
const ASSET_TYPES = {cash:'現金', bank:'活存', saving:'存款', stock:'股票投資', biz:'創業', other:'其他資產'};
const LIAB_TYPES = {card:'信用卡', mortgage:'房貸', car:'車貸', student:'學貸', loan:'信貸', personal:'親友借款', other:'其他負債'};
const LIQUID = {cash:1, bank:1, saving:1};
const WISH_LEVELS = {1:'需要', 2:'想要', 3:'夢想'};

const DEFAULT = {
  v: 2,
  txs: [],
  cats: {
    expense: [
      {id:'food',name:'餐飲',icon:'🍜'},{id:'drink',name:'飲料',icon:'🧋'},{id:'traffic',name:'交通',icon:'🚇'},
      {id:'shop',name:'購物',icon:'🛍️'},{id:'fun',name:'娛樂',icon:'🎮'},{id:'home',name:'居家',icon:'🏠'},
      {id:'bill',name:'帳單',icon:'🧾'},{id:'health',name:'醫療',icon:'💊'},{id:'learn',name:'學習',icon:'📚'},
      {id:'bizcost',name:'創業支出',icon:'🧰'},{id:'interest',name:'利息',icon:'🏷️'},{id:'other',name:'其他',icon:'📦'}
    ],
    income: [
      {id:'salary',name:'薪水',icon:'💼'},{id:'bonus',name:'獎金',icon:'🎁'},{id:'invest',name:'投資',icon:'📈'},
      {id:'side',name:'副業',icon:'💡'},{id:'bizinc',name:'創業收入',icon:'🚀'},{id:'iother',name:'其他',icon:'💰'}
    ]
  },
  accts: [
    {id:'cash',name:'現金',icon:'💵',kind:'asset',type:'cash',init:0},
    {id:'bank',name:'銀行',icon:'🏦',kind:'asset',type:'bank',init:0},
    {id:'saving',name:'存款帳戶',icon:'🐷',kind:'asset',type:'saving',init:0},
    {id:'stock',name:'股票帳戶',icon:'📈',kind:'asset',type:'stock',init:0},
    {id:'biz',name:'創業帳戶',icon:'🚀',kind:'asset',type:'biz',init:0},
    {id:'card',name:'信用卡',icon:'💳',kind:'liability',type:'card',init:0}
  ],
  goals: [],
  cards: {},
  wishes: [],
  budget: 0,
  theme: 'auto'
};

const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(n).toLocaleString('zh-TW');
const smoney = n => (n < 0 ? '-$' : '$') + money(Math.abs(n));
const pad = n => n < 10 ? '0' + n : '' + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseD = s => new Date(s + 'T00:00:00');
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };

let db = load();
const now = new Date();
const view = { y: now.getFullYear(), m: now.getMonth(), page: 'list', statType: 'expense', q: '', plan: 'goals', ana: 'stats' };

/* ---------- storage ---------- */
// v1 → v2：帳戶加上資產／負債屬性，補上存款、股票、創業帳戶
function migrate(d){
  if (d.v >= 2) return d;
  d.accts = (d.accts || []).map(a => {
    if (a.kind) return a;
    if (a.id === 'card') return Object.assign({}, a, {kind:'liability', type:'card', init:0});
    return Object.assign({}, a, {kind:'asset', type: ASSET_TYPES[a.id] ? a.id : 'other', init:0});
  });
  DEFAULT.accts.forEach(a => { if (!d.accts.some(x => x.id === a.id)) d.accts.push(clone(a)); });
  if (d.cats) {
    ['expense','income'].forEach(t => DEFAULT.cats[t].forEach(c => {
      if (['bizcost','interest','bizinc'].indexOf(c.id) >= 0 && d.cats[t] && !d.cats[t].some(x => x.id === c.id)) d.cats[t].splice(Math.max(0, d.cats[t].length - 1), 0, clone(c));
    }));
  }
  d.v = 2;
  return d;
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(clone(DEFAULT), migrate(JSON.parse(raw)));
  } catch(e) {}
  return clone(DEFAULT);
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e) { toast('儲存失敗：瀏覽器儲存空間不足或被封鎖'); }
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- lookups & money math ---------- */
function findCat(type, id){
  return (db.cats[type] || []).find(c => c.id === id) || {id, name:'（已刪除分類）', icon:'❔'};
}
function findAcct(id){
  return db.accts.find(a => a.id === id) || {id, name:'（已刪除帳戶）', icon:'❔', kind:'asset', type:'other', init:0};
}
function monthKeyOf(y, m){ const d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function txsOfMonth(y, m){ const k = monthKeyOf(y, m); return db.txs.filter(t => t.date.slice(0,7) === k); }
function sums(txs){
  let exp = 0, inc = 0;
  txs.forEach(t => { if (t.type === 'expense') exp += t.amount; else if (t.type === 'income') inc += t.amount; });
  return {exp, inc};
}
// 資產帳戶回傳餘額；負債帳戶回傳欠款（正數＝還欠多少）
function bal(a, upto){
  let i = 0, o = 0;
  db.txs.forEach(t => {
    if (upto && t.date > upto) return;
    if (t.type === 'income' && t.acct === a.id) i += t.amount;
    else if (t.type === 'expense' && t.acct === a.id) o += t.amount;
    else if (t.type === 'transfer') { if (t.acct === a.id) o += t.amount; if (t.to === a.id) i += t.amount; }
  });
  return a.kind === 'liability' ? (a.init || 0) + o - i : (a.init || 0) + i - o;
}
function worth(upto){
  let asset = 0, liab = 0;
  db.accts.forEach(a => { if (a.kind === 'liability') liab += bal(a, upto); else asset += bal(a, upto); });
  return {asset, liab, net: asset - liab};
}
function avgDailyExpense(){
  const end = todayStr(), start = ymd(new Date(Date.now() - 89 * 86400000));
  const list = db.txs.filter(t => t.type === 'expense' && t.date >= start && t.date <= end);
  if (!list.length) return 0;
  const first = list.reduce((m, t) => t.date < m ? t.date : m, end);
  const span = Math.min(90, Math.max(30, daysBetween(first, end) + 1));
  return list.reduce((s, t) => s + t.amount, 0) / span;
}
// 有利率時用攤還公式估算剩餘期數
function payoffMonths(owed, ratePct, monthly){
  if (owed <= 0) return 0;
  if (!(monthly > 0)) return null;
  const r = (ratePct || 0) / 100 / 12;
  if (r === 0) return Math.ceil(owed / monthly);
  if (monthly <= owed * r) return Infinity;
  return Math.ceil(-Math.log(1 - r * owed / monthly) / Math.log(1 + r));
}
function addMonths(n){ const d = new Date(); d.setMonth(d.getMonth() + n); return d.getFullYear() + '/' + (d.getMonth()+1); }

/* ---------- theme & icon ---------- */
function applyTheme(){
  if (db.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', db.theme);
  $('themeSel').value = db.theme;
}
function makeIcon(){
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 180, 180);
      g.addColorStop(0, '#C9D9E6'); g.addColorStop(1, '#8FAAC3');
      x.fillStyle = g; x.fillRect(0,0,180,180);
      x.shadowColor = 'rgba(40,60,80,.3)'; x.shadowBlur = 8; x.shadowOffsetY = 4;
      x.drawImage(img, 14, 16, 152, 152);
      const url = c.toDataURL('image/png');
      $('appIcon').href = url;   // 主畫面圖示用同資料夾的 money-book-icon.png
    } catch(e) {}
  };
  img.src = PET_IMG;
}

function txRow(t){
  let ic, title, sub, amt;
  if (t.type === 'transfer') {
    const a = findAcct(t.acct), b = findAcct(t.to);
    ic = b.kind === 'liability' ? '✅' : '🔁';
    title = b.kind === 'liability' ? '還款' : '轉帳';
    sub = esc(a.name + ' → ' + b.name);
    amt = '<span class="amt num tr">' + money(t.amount) + '</span>';
  } else {
    const c = findCat(t.type, t.cat), a = findAcct(t.acct);
    ic = esc(c.icon); title = esc(c.name); sub = esc(a.icon + ' ' + a.name);
    amt = '<span class="amt num ' + (t.type === 'expense' ? 'exp">-' : 'inc">+') + money(t.amount) + '</span>';
  }
  if (t.note) sub += ' · ' + esc(t.note);
  return '<button class="row tx" data-id="' + esc(t.id) + '"><span class="ic">' + ic + '</span><span class="main"><div class="t">' + title
    + '</div><div class="s">' + sub + '</div></span>' + amt + '</button>';
}

function renderList(){
  renderGreet(); renderDaily();
  let txs = txsOfMonth(view.y, view.m);
  const {exp, inc} = sums(txs);
  $('sumExp').textContent = money(exp);
  $('sumInc').textContent = money(inc);
  $('sumBal').textContent = (inc - exp < 0 ? '-' : '') + money(Math.abs(inc - exp));

  if (db.budget > 0) {
    $('budgetBox').classList.remove('hidden');
    const pct = exp / db.budget * 100;
    $('budgetBar').style.width = Math.min(pct, 100) + '%';
    $('budgetBar').classList.toggle('over', pct > 100);
    $('budgetLeft').textContent = exp <= db.budget ? '預算剩餘 $' + money(db.budget - exp) : '超出預算 $' + money(exp - db.budget);
    $('budgetPct').textContent = Math.round(pct) + '%';
  } else $('budgetBox').classList.add('hidden');

  const q = view.q.trim().toLowerCase();
  if (q) txs = txs.filter(t => {
    const parts = [t.note, t.amount, findAcct(t.acct).name];
    if (t.type === 'transfer') parts.push(findAcct(t.to).name, '轉帳 還款'); else parts.push(findCat(t.type, t.cat).name);
    return parts.join(' ').toLowerCase().indexOf(q) >= 0;
  });
  txs.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts);

  if (!txs.length) {
    $('txList').innerHTML = q
      ? '<div class="empty"><div class="big">🔍</div>找不到符合的紀錄</div>'
      : '<div class="empty"><div class="mascot" style="display:inline-block">' + mascotSVG(88) + '</div><br>這個月還沒有紀錄<br>按下方 ＋ 記下第一筆吧</div>';
    return;
  }
  const groups = {}, order = [];
  txs.forEach(t => { if (!groups[t.date]) { groups[t.date] = []; order.push(t.date); } groups[t.date].push(t); });
  const wk = ['日','一','二','三','四','五','六'];
  $('txList').innerHTML = order.map(d => {
    const list = groups[d], dayExp = sums(list).exp, dt = parseD(d);
    return '<div class="day"><div class="day-head"><span>' + (dt.getMonth()+1) + '/' + dt.getDate() + '（' + wk[dt.getDay()] + '）'
      + (d === todayStr() ? ' · 今天' : '') + '</span><span class="num">' + (dayExp ? '支出 $' + money(dayExp) : '') + '</span></div><div class="card">'
      + list.map(txRow).join('') + '</div></div>';
  }).join('');
}

function renderAssets(){
  const w = worth();
  $('netWorth').textContent = smoney(w.net);

  $('ratioL').classList.toggle('hidden', !w.liab);
  $('ratioAT').textContent = '資產 ' + Math.round(ap) + '%';
  $('ratioLT').textContent = w.liab > 0 ? '負債 ' + Math.round(100 - ap) + '%' : '無負債';
  $('totAsset').textContent = '$' + money(w.asset);
  $('totLiab').textContent = '$' + money(w.liab);

  // 近 6 個月月底淨資產
  const pts = [];
  for (let k = 5; k >= 0; k--) {
    const d = new Date(now.getFullYear(), now.getMonth() - k + 1, 0);
    pts.push({label: (d.getMonth()+1) + '月', v: worth(k === 0 ? todayStr() : ymd(d)).net});
  }
  $('nwChart').innerHTML = lineChart(pts);

  // 總資產：依類型組成 + 帳戶列表
  const assets = db.accts.filter(a => a.kind !== 'liability');
  const byType = {}; let pos = 0;
  assets.forEach(a => { const b = bal(a); if (b > 0) { byType[a.type] = (byType[a.type] || 0) + b; pos += b; } });
  const types = Object.keys(byType).sort((a,b) => byType[b] - byType[a]);
  $('assetComp').innerHTML = pos > 0
    ? '<div class="ratio">' + types.map(t => '<i style="width:' + (byType[t] / pos * 100) + '%;background:' + (TYPE_COLORS[t] || TYPE_COLORS.other) + '"></i>').join('') + '</div>'
      + '<div class="lg">' + types.map(t => '<span><i style="background:' + (TYPE_COLORS[t] || TYPE_COLORS.other) + '"></i>' + esc(ASSET_TYPES[t] || '其他') + ' ' + Math.round(byType[t] / pos * 100) + '%</span>').join('') + '</div>'
    : '<p class="muted" style="margin:0 0 6px">點下方帳戶，輸入目前餘額</p>';
  $('assetList').innerHTML = assets.map(a => {
    const b = bal(a);
    return '<button class="row" data-acct="' + esc(a.id) + '"><span class="ic">' + esc(a.icon) + '</span><span class="main"><div class="t">' + esc(a.name)
      + '</div><div class="s">' + esc(ASSET_TYPES[a.type] || '其他資產') + (pos > 0 && b > 0 ? ' · 佔 ' + Math.round(b / pos * 100) + '%' : '') + (LIQUID[a.type] ? ' · 可隨時動用' : '') + '</div></span><span class="amt num ' + (b < 0 ? 'exp' : '') + '">' + smoney(b) + '</span></button>';
  }).join('');

  // 總負債：每筆負債
  const debts = db.accts.filter(a => a.kind === 'liability');
  let monthlyAll = 0, interestAll = 0, prinAll = 0, prinOwed = 0, maxMonths = 0, unknown = 0, never = false;
  $('debtList').innerHTML = debts.map(a => {
    const owed = bal(a);
    if (owed > 0) {
      monthlyAll += a.monthly || 0; interestAll += owed * (a.rate || 0) / 100 / 12;
      const n = payoffMonths(owed, a.rate, a.monthly);
      if (n === null) unknown++; else if (n === Infinity) never = true; else maxMonths = Math.max(maxMonths, n);
    }
    if (a.principal > 0) { prinAll += a.principal; prinOwed += Math.max(0, owed); }
    const meta = [];
    if (a.rate) meta.push('<span>年利率 ' + a.rate + '%</span>');
    if (a.monthly) meta.push('<span>每月還 $' + money(a.monthly) + '</span>');
    if (a.dueDay) {
      const t = new Date(), today0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());

      const n = payoffMonths(owed, a.rate, a.monthly);

    }
    let prog = '';

      const p = Math.max(0, Math.min(1, (a.principal - owed) / a.principal));
      prog = '<div class="bar"><i class="good" style="width:' + (p*100) + '%"></i></div><div class="meta"><span>已還 ' + Math.round(p*100) + '%</span><span>原始金額 $' + money(a.principal) + '</span></div>';

      + '</div><div class="s">' + esc(LIAB_TYPES[a.type] || '其他負債') + (w.liab > 0 && owed > 0 ? ' · 佔 ' + Math.round(owed / w.liab * 100) + '%' : '') + '</div></span><span class="amt num ' + (owed > 0 ? 'exp' : 'inc') + '">' + (owed > 0 ? '$' + money(owed) : '已還清 🎉') + '</span></button>'
      + prog + (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '')
      + (owed > 0 ? '<div class="foot"><span>' + (a.rate ? '本月利息約 $' + money(owed * a.rate / 100 / 12) : '') + '</span><button class="btn sm" data-pay="' + esc(a.id) + '">記一筆還款</button></div>' : '')
      + '</div>';
  }).join('') || '<div class="empty">沒有負債，很棒！</div>';

  // 剩餘債務總覽
  $('debtLeft').textContent = '$' + money(Math.max(0, w.liab));
  $('debtLeft').className = 'num ' + (w.liab > 0 ? 'exp-c' : 'inc-c');
  if (w.liab <= 0) {
    $('debtOverview').innerHTML = '<div class="empty" style="padding:16px 0"><div class="big">🎉</div>目前沒有任何債務</div>';
  } else {
    let h = '';
    if (prinAll > 0) {
      const paid = Math.max(0, prinAll - prinOwed), p = Math.min(1, paid / prinAll);
      h += '<div class="ov-top"><span>貸款已還 <b class="num">$' + money(paid) + '</b></span><span>原始借款 $' + money(prinAll) + '</span></div>'
        + '<div class="bar"><i class="good" style="width:' + (p*100) + '%"></i></div>'
        + '<div class="ov-top" style="margin:6px 0 0"><span>已還 ' + Math.round(p*100) + '%</span><span>還差 $' + money(prinOwed) + '</span></div>';
    } else {
      h += '<p class="muted" style="margin:0">在負債裡填上「原始借款金額」，就能看到還款進度。</p>';
    }
    const free = never ? '還款額不足' : maxMonths ? addMonths(maxMonths) : '—';
    h += '<div class="ov-grid">'
      + '<div><div class="k">每月應還</div><div class="v num">$' + money(monthlyAll) + '</div></div>'
      + '<div><div class="k">每月利息約</div><div class="v num">$' + money(interestAll) + '</div></div>'
      + '<div><div class="k">負債比（負債÷資產）</div><div class="v num">' + (w.asset > 0 ? Math.round(w.liab / w.asset * 100) + '%' : '—') + '</div></div>'
      + '<div><div class="k">預計全部還清</div><div class="v num">' + free + '</div></div>'
      + '</div>' + (unknown ? '<p class="muted" style="margin:10px 0 0">有 ' + unknown + ' 筆負債沒填每月還款，無法估算還清時間。</p>' : '');
    $('debtOverview').innerHTML = h;
  }

  // 存錢進度
  const goals = db.goals;
  const m = txsOfMonth(now.getFullYear(), now.getMonth()), ms = sums(m), saved = ms.inc - ms.exp;
  let sp = '<div class="ov-top"><span>本月存下 <b class="num ' + (saved < 0 ? 'exp-c' : 'inc-c') + '">' + smoney(saved) + '</b></span><span>' + (ms.inc > 0 ? '儲蓄率 ' + Math.round(saved / ms.inc * 100) + '%' : '本月還沒有收入') + '</span></div>';
  if (!goals.length) {
    sp += '<div class="empty" style="padding:16px 0">還沒有存錢目標<br><button class="btn sm" id="spNewGoal" style="margin-top:8px">＋ 新增目標</button></div>';
  } else {
    let ts = 0, tt = 0, done = 0;
    goals.forEach(g => { const s = Math.min(goalSaved(g), g.target); ts += s; tt += g.target; if (goalSaved(g) >= g.target) done++; });
    const p = tt ? ts / tt : 0;
    sp += '<div class="ov-top" style="margin-top:14px"><span>所有目標 <b class="num">$' + money(ts) + '</b> / $' + money(tt) + '</span><span>' + Math.round(p*100) + '%</span></div>'
      + '<div class="bar"><i class="' + (p >= 1 ? 'good' : '') + '" style="width:' + (p*100) + '%"></i></div>'
      + '<p class="muted" style="margin:6px 0 0">' + goals.length + ' 個目標，已達成 ' + done + ' 個' + (tt > ts ? '，還差 $' + money(tt - ts) : '') + '</p>'
      + '<div class="mini">' + goals.map(g => {
        const s = goalSaved(g), q = Math.min(1, s / g.target);
        return '<div class="r"><span class="e">' + esc(g.icon || '🎯') + '</span><div class="b"><div class="top2"><span>' + esc(g.name) + '</span><span class="num">$' + money(s) + ' / $' + money(g.target) + '・' + Math.round(q*100) + '%</span></div>'
          + '<div class="bar"><i class="' + (q >= 1 ? 'good' : '') + '" style="width:' + (q*100) + '%"></i></div></div></div>';
      }).join('') + '</div>';
  }
  $('saveProgress').innerHTML = sp;
}

function lineChart(pts){
  const W = 320, H = 130, L = 10, R = 10, T = 24, B = 20;
  const vals = pts.map(p => p.v);
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const line = pts.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length-1) + ' ' + (H - B) + ' L' + x(0) + ' ' + (H - B) + ' Z';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="淨資產走勢">'
    + '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + (H-B) + '" y2="' + (H-B) + '" style="stroke:var(--line)"/>'
    + '<path d="' + area + '" style="fill:var(--accent);opacity:.12"/>'
    + '<path d="' + line + '" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>';
  pts.forEach((p,i) => {
    const last = i === pts.length - 1;
    s += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (last ? 4.5 : 2.5) + '" style="fill:var(--accent)"><title>' + p.label + '：' + smoney(p.v) + '</title></circle>'
      + '<text x="' + x(i) + '" y="' + (H - 4) + '" font-size="10" text-anchor="' + (i === 0 ? 'start' : last ? 'end' : 'middle') + '" style="fill:var(--muted)">' + p.label + '</text>';
  });
  const lv = pts[pts.length-1];
  s += '<text x="' + x(pts.length-1) + '" y="' + Math.max(12, y(lv.v) - 10) + '" font-size="11" font-weight="700" text-anchor="end" style="fill:var(--ink)">' + smoney(lv.v) + '</text></svg>';
  return s;
}

/* ----- 規劃：目標 / 願望 ----- */
function goalSaved(g){ return g.acct ? Math.max(0, bal(findAcct(g.acct))) : (g.saved || 0); }
function renderPlan(){
  document.querySelectorAll('#planSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === view.plan));
  view.plan === 'goals' ? renderGoals() : view.plan === 'wishes' ? renderWishes() : renderAlbum();
}
function renderGoals(){
  const goals = db.goals.slice().sort((a,b) => (goalSaved(a) >= a.target) - (goalSaved(b) >= b.target));
  let h = '<div class="sec-head"><h2>我的目標</h2><button class="add" id="newGoal">＋ 新增目標</button></div>';
  if (!goals.length) {
    h += '<div class="card"><div class="empty"><div class="big">🎯</div>設定一個存錢目標<br>例如：緊急預備金、旅行、創業基金</div></div>';
  } else {
    h += '<div class="card">' + goals.map(g => {
      const s = goalSaved(g), pct = Math.min(1, s / g.target), done = s >= g.target;
      let foot;
      if (done) foot = '<span class="st good">已達成 🎉</span>';
      else if (g.deadline) {
        const left = daysBetween(todayStr(), g.deadline);
        if (left < 0) foot = '<span class="st warn">已過期限，還差 $' + money(g.target - s) + '</span>';
        else foot = '<span>還剩 ' + left + ' 天 · 每月需存 <b class="num" style="color:var(--ink)">$' + money((g.target - s) / Math.max(1, left / 30.44)) + '</b></span>';
      } else foot = '<span>還差 $' + money(g.target - s) + '</span>';
      return '<div class="item"><button class="hd" data-goal="' + esc(g.id) + '"><span class="ic">' + esc(g.icon || '🎯') + '</span>'
        + '<span class="main"><div class="t">' + esc(g.name) + '</div><div class="s">'
        + (g.acct ? '跟著「' + esc(findAcct(g.acct).name) + '」' : '手動記錄') + (g.deadline ? ' · 期限 ' + esc(g.deadline) : '') + '</div></span>'
        + '<span class="right num"><b>' + Math.round(pct*100) + '%</b><div class="muted" style="font-size:12px">$' + money(s) + ' / $' + money(g.target) + '</div></span></button>'
        + '<div class="bar"><i class="' + (done ? 'good' : '') + '" style="width:' + (pct*100) + '%"></i></div>'
        + '<div class="foot">' + foot + (!g.acct && !done ? '<button class="btn sm" data-deposit="' + esc(g.id) + '">存入／取出</button>' : '') + '</div></div>';
    }).join('') + '</div>';
  }
  $('planBody').innerHTML = h;
}
function renderWishes(){
  const open = db.wishes.filter(w => !w.bought).sort((a,b) => a.level - b.level || (a.created < b.created ? -1 : 1));
  const done = db.wishes.filter(w => w.bought);
  const total = open.reduce((s,w) => s + w.price, 0);
  const ready = open.filter(w => daysBetween(w.created, todayStr()) >= COOL_DAYS).length;
  const daily = avgDailyExpense();
  let h = '<div class="sec-head"><h2>願望清單</h2><button class="add" id="newWish">＋ 新增願望</button></div>';
  if (open.length) h += '<p class="muted" style="margin:0 4px 8px;line-height:1.6">共 ' + open.length + ' 項，合計 $' + money(total) + '。放滿 ' + COOL_DAYS + ' 天還想要，再決定要不要買。' + (ready ? '已有 ' + ready + ' 項過了冷靜期。' : '') + '</p>';
  if (!open.length) {
    h += '<div class="card"><div class="empty"><div class="big">✨</div>想買的東西先放這裡<br>冷靜 ' + COOL_DAYS + ' 天，避免衝動消費</div></div>';
  } else {
    h += '<div class="card">' + open.map(w => {
      const age = daysBetween(w.created, todayStr()), left = COOL_DAYS - age;
      const cool = left > 0 ? '<span class="st ok">冷靜中，還要 ' + left + ' 天</span>' : '<span class="st good">冷靜期已過</span>';
      const eq = daily > 0 ? '約 ' + (w.price / daily < 10 ? (w.price / daily).toFixed(1) : Math.round(w.price / daily)) + ' 天的生活費' : '';
      return '<div class="item"><button class="hd" data-wish="' + esc(w.id) + '"><span class="main"><div class="t">' + esc(w.name)

        + '<b class="num">$' + money(w.price) + '</b></button>'
        + '<div class="foot">' + cool + '<span>' + eq + '</span></div>'
        + '<div class="acts"><button class="btn sm" data-buy="' + esc(w.id) + '">買了，記一筆</button><button class="btn sm" data-wgoal="' + esc(w.id) + '">設成存錢目標</button></div></div>';
    }).join('') + '</div>';
  }
  if (done.length) {
    h += '<details class="done-list"><summary>已實現的願望（' + done.length + '）</summary><div class="card" style="margin-top:8px">'
      + done.map(w => '<button class="row" data-wish="' + esc(w.id) + '"><span class="ic">✅</span><span class="main"><div class="t">' + esc(w.name) + '</div><div class="s">' + esc(w.bought) + ' 買下</div></span><span class="amt num tr">$' + money(w.price) + '</span></button>').join('')
      + '</div></details>';
  }
  $('planBody').innerHTML = h;
}

function arc(cx, cy, r, a0, a1){
  const x0 = cx + r*Math.sin(a0), y0 = cy - r*Math.cos(a0), x1 = cx + r*Math.sin(a1), y1 = cy - r*Math.cos(a1);
  return 'M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + x1 + ' ' + y1;
}
function renderAna(){
  document.querySelectorAll('#anaSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === view.ana));
  $('anaStats').classList.toggle('hidden', view.ana !== 'stats');

    if (slices.length === 1) svg += '<circle cx="70" cy="70" r="52" fill="none" stroke="' + slices[0].color + '" stroke-width="22"/>';
    else slices.forEach(s => {

    const lg = '<div class="legend">' + slices.map(s => '<div><i style="background:' + s.color + '"></i><span>' + esc(s.cat.name) + '</span><b class="num">' + Math.round(s.v/total*100) + '%</b></div>').join('') + '</div>';
    $('donut').innerHTML = '<div class="donut-wrap">' + svg + lg + '</div>';

      + '</span><span class="num">$' + money(r.v) + '</span></div><div class="bar"><i style="width:' + (r.v / rows[0].v * 100) + '%;background:' + r.color + '"></i></div></div></div>').join('');

    if (i === 0 || (i+1) % 5 === 0) b += '<text x="' + (i*bw + bw/2) + '" y="' + (H + 13) + '" font-size="9" text-anchor="middle" style="fill:var(--muted)">' + (i+1) + '</text>';

function diagnose(){
  const y = view.y, m = view.m, items = [];
  const cur = txsOfMonth(y, m), {exp, inc} = sums(cur);
  const dim = new Date(y, m + 1, 0).getDate();
  const t = new Date(), isCur = t.getFullYear() === y && t.getMonth() === m;
  const isFuture = new Date(y, m, 1) > t;
  const elapsed = isCur ? t.getDate() : dim;
  const ex = cur.filter(x => x.type === 'expense');
  // 月底預估：已花的 + 日常小額支出的每日速度 × 剩餘天數（房租、大筆購物不會每天重複）
  const daily = ex.filter(x => x.amount < 1000).reduce((s,x) => s + x.amount, 0) / elapsed;
  const proj = isCur ? exp + daily * (dim - elapsed) : exp;

  // 前 3 個月（有資料的月份）平均
  const prev = [];
  for (let k = 1; k <= 3; k++) { const l = txsOfMonth(y, m - k); if (l.length) prev.push(l); }
  const prevExpAvg = prev.length ? prev.reduce((s,l) => s + sums(l).exp, 0) / prev.length : 0;

  // 1. 儲蓄率
  if (inc > 0) {
    const r = (inc - exp) / inc;
    items.push({title:'儲蓄率', value: Math.round(r*100) + '%', status: r >= .3 ? 'good' : r >= .1 ? 'ok' : 'warn',
      text: r >= .3 ? '收入有三成以上存下來，維持這個節奏。' : r >= .1 ? '有在存錢，可以試著把目標拉到 20%～30%。' : r >= 0 ? '幾乎沒有存到錢。可以在發薪日先轉一筆到存款帳戶，剩下的再花。' : '本月支出超過收入 $' + money(exp - inc) + '，要留意現金流。'});
  } else if (exp > 0) {
    items.push({title:'儲蓄率', value:'—', status:'info', text:'本月還沒記錄收入，無法計算儲蓄率。'});
  }

  // 2. 預算與月底預估
  if (exp > 0 && !isFuture) {
    if (db.budget > 0) {
      const r = proj / db.budget;
      items.push({title: isCur ? '月底支出預估' : '預算達成', value: '$' + money(proj), status: r <= .9 ? 'good' : r <= 1 ? 'ok' : 'warn',
        text: (isCur ? '照目前速度，月底約花 $' + money(proj) + '，' : '') + (r <= 1 ? '在預算 $' + money(db.budget) + ' 之內。' : '會超出預算 $' + money(proj - db.budget) + '。' + (isCur && dim > elapsed ? (exp >= db.budget ? '目前已經超出預算，剩下 ' + (dim - elapsed) + ' 天盡量只花必要開銷。' : '剩下 ' + (dim - elapsed) + ' 天，每天控制在 $' + money((db.budget - exp) / (dim - elapsed)) + ' 以內。') : ''))});
    } else if (isCur) {
      items.push({title:'月底支出預估', value:'$' + money(proj), status:'info', text:'已花的加上日常開銷的速度推估。到右上角「設定」設定每月預算，就能知道會不會超支。'});
    }
  }

  // 3. 與前幾個月比較
  if (prevExpAvg > 0 && exp > 0) {
    const f = isCur ? dim / elapsed : 1, r = proj / prevExpAvg - 1;
    const byCur = {}, byPrev = {};
    ex.forEach(x => byCur[x.cat] = (byCur[x.cat] || 0) + (x.amount < 1000 ? x.amount * f : x.amount));
    prev.forEach(l => l.filter(x => x.type === 'expense').forEach(x => byPrev[x.cat] = (byPrev[x.cat] || 0) + x.amount / prev.length));
    const diffs = Object.keys(Object.assign({}, byCur, byPrev)).map(k => ({cat: findCat('expense', k), d: (byCur[k] || 0) - (byPrev[k] || 0)}))
      .filter(x => Math.abs(x.d) >= 300).sort((a,b) => b.d - a.d);
    const up = diffs.filter(x => x.d > 0).slice(0, 3), down = diffs.filter(x => x.d < 0).reverse().slice(0, 2);
    let txt = (isCur ? '以目前速度推估，' : '') + '比前 ' + prev.length + ' 個月平均（$' + money(prevExpAvg) + '）' + (r >= 0 ? '多 ' : '少 ') + Math.abs(Math.round(r*100)) + '%。';
    if (up.length) txt += '增加最多：' + up.map(x => x.cat.icon + x.cat.name + ' +$' + money(x.d)).join('、') + '。';
    if (down.length) txt += '減少：' + down.map(x => x.cat.icon + x.cat.name + ' -$' + money(-x.d)).join('、') + '。';
    items.push({title:'和前幾個月比', value: (r >= 0 ? '+' : '') + Math.round(r*100) + '%', status: r <= .05 ? 'good' : r <= .2 ? 'ok' : 'warn', text: txt});
  }

  // 4. 小額消費（拿鐵因子）
  const small = ex.filter(x => x.amount < 200);
  if (exp > 0 && small.length >= 5) {
    const s = small.reduce((a,x) => a + x.amount, 0), r = s / exp;
    const topCat = {}; small.forEach(x => topCat[x.cat] = (topCat[x.cat] || 0) + x.amount);
    const tk = Object.keys(topCat).sort((a,b) => topCat[b] - topCat[a])[0], tc = findCat('expense', tk);
    items.push({title:'小額消費', value: small.length + ' 筆 · $' + money(s), status: r < .15 ? 'good' : r < .3 ? 'ok' : 'warn',
      text: '200 元以下的消費佔支出 ' + Math.round(r*100) + '%，最多花在 ' + tc.icon + tc.name + '（$' + money(topCat[tk]) + '）。以這個月的量來算，一年約 $' + money(s * 12) + '。'});
  }

  // 5. 週末 vs 平日
  if (ex.length >= 8) {
    let we = 0, wd = 0, weD = 0, wdD = 0;
    for (let d = 1; d <= elapsed; d++) { const w = new Date(y, m, d).getDay(); (w === 0 || w === 6) ? weD++ : wdD++; }
    ex.forEach(x => { const w = parseD(x.date).getDay(); (w === 0 || w === 6) ? we += x.amount : wd += x.amount; });
    if (weD && wdD && wd > 0) {
      const a = we / weD, b = wd / wdD, r = a / b;
      items.push({title:'週末消費', value: '平日的 ' + r.toFixed(1) + ' 倍', status: r <= 1.5 ? 'good' : r <= 2.5 ? 'ok' : 'warn',
        text: '週末平均每天 $' + money(a) + '，平日 $' + money(b) + '。' + (r > 1.5 ? '週末花費明顯偏高，可以先規劃好假日行程和預算。' : '週末和平日的花費差距不大。')});
    }
  }

  // 6. 緊急預備金
  const liquid = db.accts.filter(a => a.kind !== 'liability' && LIQUID[a.type]).reduce((s,a) => s + bal(a), 0);
  const mExp = prevExpAvg || proj;
  if (mExp > 0) {
    const mo = liquid / mExp;
    items.push({title:'緊急預備金', value: Math.max(0, mo).toFixed(1) + ' 個月', status: mo >= 6 ? 'good' : mo >= 3 ? 'ok' : 'warn',
      text: '現金、活存和存款共 $' + money(liquid) + '，可以支撐約 ' + Math.max(0, mo).toFixed(1) + ' 個月的生活。' + (mo < 6 ? '建議準備 6 個月（約 $' + money(mExp * 6) + '），可以到「規劃」設成目標。' : '已經足夠，多出來的可以考慮投資。')});
  }

  // 7. 負債比
  const w = worth();
  if (w.liab > 0) {
    const r = w.asset > 0 ? w.liab / w.asset : Infinity;
    const card = db.accts.filter(a => a.kind === 'liability' && a.type === 'card').reduce((s,a) => s + Math.max(0, bal(a)), 0);
    items.push({title:'負債比', value: isFinite(r) ? Math.round(r*100) + '%' : '—', status: r < .3 ? 'good' : r < .5 ? 'ok' : 'warn',
      text: '總負債 $' + money(w.liab) + '，總資產 $' + money(w.asset) + '。' + (r >= .5 ? '負債偏高，先還利率最高的那筆。' : '') + (card > 0 ? '信用卡未繳 $' + money(card) + '，記得全額繳清，避免循環利息。' : '')});
  }

  // 8. 最大筆支出
  const top = ex.slice().sort((a,b) => b.amount - a.amount).slice(0, 3);
  if (top.length) items.push({title:'本月最大筆支出', value:'', status:'info',
    text: top.map(x => { const c = findCat('expense', x.cat); return c.icon + ' ' + (x.note || c.name) + ' $' + money(x.amount) + '（' + (+x.date.slice(5,7)) + '/' + (+x.date.slice(8)) + '）'; }).join('　')});

  return {items, isFuture};
}
function renderDiag(){
  const {items, isFuture} = diagnose();
  const scored = items.filter(i => i.status !== 'info');
  if (isFuture || !items.length) {
    $('anaDiag').innerHTML = '<div class="section"><div class="empty"><div class="big">🩺</div>' + (isFuture ? '這個月還沒開始' : '這個月的資料還不夠<br>多記幾筆，再來看診斷') + '</div></div>';
    return;
  }
  let head = '';

    const col = score >= 80 ? 'var(--inc)' : score >= 55 ? 'var(--warn)' : 'var(--exp)';
    const label = score >= 80 ? '財務狀況健康' : score >= 55 ? '還不錯，有幾點可以加強' : '有幾個地方需要注意';

      + '<text x="50" y="58" text-anchor="middle" font-size="24" font-weight="900" style="fill:var(--ink)">' + score + '</text></svg>'

}

  if (!s || !/^[0-9+\-*/().]+$/.test(s)) return NaN;

  catch(e) { return NaN; }
}

  const d = $('fAmount'), e = form.expr;
  d.textContent = e ? prettyExpr(e) : '0';
  d.className = 'amt-disp num' + (e ? '' : ' ph') + (form.type === 'expense' ? ' exp' : form.type === 'income' ? ' inc' : '');
  d.scrollLeft = d.scrollWidth;
  const v = evalAmount(trimOp(e));
  $('calcHint').textContent = hasOp(trimOp(e)) && !isNaN(v) ? '= ' + money(v) : '';
  $('kOk').textContent = hasOp(trimOp(e)) ? '=' : (form.id ? '儲存' : '完成');
}
function pressKey(k){
  let e = form.expr;
  const seg = e.split(/[+\-*/]/).pop();
  if (/^\d+$/.test(k)) {
    if (e.length >= 24) return;
    if (seg === '0') e = e.slice(0, -1) + (k === '00' ? '0' : k);
    else if (seg === '' && k === '00') e += '0';
    else if (seg.indexOf('.') >= 0 && seg.split('.')[1].length + k.length > 2) return;   // 最多到小數第二位
    else e += k;
  } else if (k === '.') {
    if (seg.indexOf('.') >= 0) return;
    e += seg === '' ? '0.' : '.';
  } else if (OPS.indexOf(k) >= 0) {
    if (!e) return;
    e = e.replace(/[+\-*/.]+$/, '') + k;
  } else if (k === 'back') e = e.slice(0, -1);
  else if (k === 'C') e = '';
  else if (k === 'ok') {
    const t = trimOp(e);
    if (hasOp(t)) {
      const v = evalAmount(t);
      if (isNaN(v)) { toast('算式有誤'); return; }
      e = v > 0 ? fmtNum(v) : '';
      if (v <= 0) toast('結果要大於 0');
    } else { form.expr = t; return submitTx(); }
  }
  form.expr = e; renderAmt();
}
function submitTx(){
  const amt = evalAmount(trimOp(form.expr));
  if (isNaN(amt) || amt <= 0) { toast('請用下方算盤輸入金額'); return; }
  if (!$('fDate').value) { toast('請選擇日期'); return; }
  const rec = { type: form.type, amount: amt, acct: $('fAcct').value, date: $('fDate').value, note: $('fNote').value.trim() };
  if (form.type === 'transfer') {
    rec.to = $('fTo').value;
    if (rec.to === rec.acct) { toast('轉出和轉入不能是同一個帳戶'); return; }
  } else {
    if (!form.cat) { toast('請先到設定新增分類'); return; }
    rec.cat = form.cat;
  }
  if (form.id) {
    const t = db.txs.find(x => x.id === form.id);
    delete t.to; delete t.cat;
    Object.assign(t, rec);
    toast('已更新');
  } else {
    rec.id = uid(); rec.ts = Date.now();
    var firstToday = rec.date === todayStr() && !db.txs.some(x => x.date === rec.date) && !db.cards[rec.date];
    db.txs.push(rec);
    toast(rec.type === 'transfer' ? '已記下轉帳 $' + money(amt) : (rec.type === 'expense' ? '已記下支出 $' : '已記下收入 $') + money(amt));
  }
  if (form.onSaved) form.onSaved(rec);
  save();
  if (view.page === 'list') { const d = parseD(rec.date); view.y = d.getFullYear(); view.m = d.getMonth(); }
  hideSheet('sheet'); render();
  if (firstToday) setTimeout(openDraw, 450);
}

function editAcct(a, kind){

  const L = a.kind === 'liability';

  const cur = isNew ? '' : Math.round(bal(a) * 100) / 100;
  esheet('<h3>' + (isNew ? '新增' : '編輯') + (L ? '負債' : '資產帳戶') + '</h3>'
    + '<div class="fields">'
    + '<label class="fl"><span>圖示</span><input id="aIcon" value="' + esc(a.icon) + '" maxlength="4"></label>'
    + '<label class="fl"><span>名稱</span><input id="aName" value="' + esc(a.name) + '" placeholder="' + (L ? '例如：學貸' : '例如：郵局') + '"></label>'
    + '<label class="fl"><span>類型</span><select id="aType">' + Object.keys(types).map(k => '<option value="' + k + '"' + (k === a.type ? ' selected' : '') + '>' + types[k] + '</option>').join('') + '</select></label>'
    + '<label class="fl"><span>' + (L ? '目前還欠' : '目前餘額') + '</span><input id="aBal" type="number" inputmode="decimal" value="' + cur + '" placeholder="0"></label>'
    + (L ? '<label class="fl"><span>原始借款金額</span><input id="aPrin" type="number" inputmode="decimal" value="' + (a.principal || '') + '" placeholder="選填"></label>'
      + '<label class="fl"><span>年利率 %</span><input id="aRate" type="number" inputmode="decimal" step="0.01" value="' + (a.rate || '') + '" placeholder="選填"></label>'
      + '<label class="fl"><span>每月還款</span><input id="aMon" type="number" inputmode="decimal" value="' + (a.monthly || '') + '" placeholder="選填"></label>'
      + '<label class="fl"><span>每月繳款日</span><input id="aDue" type="number" inputmode="numeric" min="1" max="31" value="' + (a.dueDay || '') + '" placeholder="1–31"></label>' : '')
    + '</div>'
    + '<p class="muted" style="margin:10px 0 0;line-height:1.6">' + (L ? '用這個帳戶付款會增加欠款；記「轉帳／還款」轉入這裡會減少欠款。' : '股票或創業帳戶的價值變動時，直接把「目前餘額」改成最新金額即可。') + '</p>'
    + '<div class="sheet-actions">' + (isNew ? '' : '<button class="btn danger" id="aDel">刪除</button>') + '<button class="btn" id="aCancel">取消</button><button class="btn primary" id="aSave">儲存</button></div>');
  $('aCancel').onclick = closeE;
  $('aSave').onclick = () => {
    const name = $('aName').value.trim();
    if (!name) { toast('請輸入名稱'); return; }
    const target = num($('aBal').value);
    const rec = isNew ? {id: uid(), kind: a.kind, init: 0} : a;
    Object.assign(rec, {name, icon: $('aIcon').value.trim() || a.icon, type: $('aType').value});
    if (L) Object.assign(rec, {principal: num($('aPrin').value), rate: num($('aRate').value), monthly: num($('aMon').value), dueDay: Math.min(31, Math.max(0, Math.round(num($('aDue').value))))});
    if (isNew) db.accts.push(rec);
    rec.init = (rec.init || 0) + (target - bal(rec));   // 校正到使用者輸入的目前金額
    save(); closeE(); render(); toast(isNew ? '已新增「' + name + '」' : '已更新');
  };
  if (!isNew) $('aDel').onclick = async () => {
    if (!L && db.accts.filter(x => x.kind !== 'liability').length <= 1) { toast('至少要保留一個資產帳戶'); return; }
    const n = db.txs.filter(t => t.acct === a.id || t.to === a.id).length;
    if (!await ask('刪除「' + a.name + '」？' + (n ? '\n已有 ' + n + ' 筆紀錄用到它，紀錄會保留，但會顯示為「已刪除帳戶」。' : ''), '刪除', true)) return;
    db.accts = db.accts.filter(x => x.id !== a.id);
    db.goals.forEach(g => { if (g.acct === a.id) { g.saved = 0; g.acct = ''; } });
    save(); render(); toast('已刪除');
  };
}

function depositGoal(g){
  esheet('<h3>' + esc(g.icon + ' ' + g.name) + '</h3><p class="muted" style="margin:0">目前 $' + money(g.saved || 0) + ' / $' + money(g.target) + '</p>'
    + '<div class="amount-box"><span>$</span><input id="dAmt" inputmode="decimal" placeholder="0"></div>'
    + '<div class="sheet-actions"><button class="btn" id="dOut">取出</button><button class="btn primary" id="dIn">存入</button></div>');
  setTimeout(() => $('dAmt').focus(), 260);
  const go = sign => {
    const v = evalAmount($('dAmt').value);
    if (isNaN(v) || v <= 0) { toast('請輸入金額'); return; }
    g.saved = Math.max(0, (g.saved || 0) + sign * v);
    save(); closeE(); render();
    toast(g.saved >= g.target ? '🎉 目標達成！' : (sign > 0 ? '已存入 $' : '已取出 $') + money(v));
  };
  $('dIn').onclick = () => go(1); $('dOut').onclick = () => go(-1);
}

const PRIORITY = {streak7:8, goal:6, first:8, nospend:5, saving:5, debt:5, over:4, save:3, treat:4, small:3, income:4, streak:3, night:3, weekend:2};

function streakDays(){
  const days = new Set(db.txs.map(t => t.date));
  let d = new Date(), n = 0;
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// 讀取「今天」真實的紀錄，整理成卡片要用的線索
function todayContext(){
  const td = todayStr(), t = new Date(), hr = t.getHours(), dow = t.getDay();
  const list = db.txs.filter(x => x.date === td);
  const ex = list.filter(x => x.type === 'expense'), exp = ex.reduce((s,x) => s + x.amount, 0);
  const inc = list.filter(x => x.type === 'income').reduce((s,x) => s + x.amount, 0);
  const trs = list.filter(x => x.type === 'transfer');
  const sv = trs.filter(x => { const b = findAcct(x.to); return b.kind !== 'liability' && (b.type === 'saving' || b.type === 'stock'); });
  const dt = trs.filter(x => findAcct(x.to).kind === 'liability');
  const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(), day = t.getDate();
  const mk = td.slice(0,7);
  const before = db.txs.filter(x => x.type === 'expense' && x.date.slice(0,7) === mk && x.date < td).reduce((s,x) => s + x.amount, 0);
  const allow = db.budget > 0 ? Math.max(0, db.budget - before) / (dim - day + 1) : null;
  const pastDays = db.txs.filter(x => x.type === 'expense' && x.date < td && x.date >= ymd(new Date(Date.now() - 60 * 86400000)));
  const firstPast = pastDays.reduce((m,x) => x.date < m ? x.date : m, td);
  const avg = pastDays.length ? pastDays.reduce((s,x) => s + x.amount, 0) / Math.max(7, daysBetween(firstPast, td)) : 0;
  const byCat = {}; ex.forEach(x => byCat[x.cat] = (byCat[x.cat] || 0) + x.amount);
  const topK = Object.keys(byCat).sort((a,b) => byCat[b] - byCat[a])[0];
  const streak = streakDays();
  const goal = db.goals.map(g => ({g, p: goalSaved(g) / g.target})).filter(o => o.p >= .7 && o.p < 1).sort((a,b) => b.p - a.p)[0];
  const over = exp > 0 && (allow !== null ? exp > allow : avg > 0 && exp > avg * 1.5 && exp > 300);
  const tags = new Set(['any']);
  if (!ex.length) tags.add('nospend');
  else if (over) tags.add('over'); else tags.add('save');
  if (ex.some(x => (x.cat === 'shop' || x.cat === 'fun') && x.amount >= 1000)) tags.add('treat');
  if (ex.some(x => x.cat === 'drink') || ex.filter(x => x.amount < 150).length >= 2) tags.add('small');
  if (sv.length) tags.add('saving');
  if (dt.length) tags.add('debt');
  if (inc > 0) tags.add('income');
  if (streak >= 3) tags.add('streak');
  if (streak >= 7) tags.add('streak7');
  if (goal) tags.add('goal');
  if (db.txs.every(x => x.date === td)) tags.add('first');
  if (dow === 0 || dow === 6) tags.add('weekend');
  if (hr >= 22 || hr < 4) tags.add('night');
  return {td, list, ex, exp, inc, sv, dt, allow, avg, byCat, topK, streak, goal, over, tags, dim, day};
}
function readingFor(c){
  const out = [];
  if (c.ex.length) {
    const tc = findCat('expense', c.topK);
    out.push('今天記了 ' + c.list.length + ' 筆，' + tc.icon + tc.name + '花最多（$' + money(c.byCat[c.topK]) + '）。');
    if (c.allow !== null) {
      if (c.exp <= c.allow) out.push('今天的可用額度是 $' + money(c.allow) + '，你只用了 $' + money(c.exp) + '，比自己想像的更有分寸。');
      else {
        const left = c.dim - c.day, rest = Math.max(0, db.budget - (txsOfMonth(new Date().getFullYear(), new Date().getMonth()).filter(x => x.type === 'expense').reduce((s,x) => s + x.amount, 0)));
        out.push('比今天的可用額度多了 $' + money(c.exp - c.allow) + '。' + (left > 0 ? '接下來 ' + left + ' 天每天 $' + money(rest / left) + ' 以內，就能溫柔地拉回來。' : ''));
      }
    } else if (c.avg > 0) {
      const r = c.exp / c.avg - 1;
      out.push(Math.abs(r) < .15 ? '和你平常一天差不多（約 $' + money(c.avg) + '），很穩定。' : '比你平常一天的 $' + money(c.avg) + (r > 0 ? '多了 ' : '少了 ') + Math.round(Math.abs(r) * 100) + '%。');
    }
  } else out.push('今天沒有任何支出，錢包也一起放了一天假。');
  if (c.inc > 0) out.push('還有 $' + money(c.inc) + ' 的收入入帳。');
  if (c.sv.length) out.push('存了 $' + money(c.sv.reduce((s,x) => s + x.amount, 0)) + ' 到' + findAcct(c.sv[0].to).name + '。');
  if (c.dt.length) out.push('還了 $' + money(c.dt.reduce((s,x) => s + x.amount, 0)) + ' 的' + findAcct(c.dt[0].to).name + '。');
  if (c.streak >= 2) out.push('這是你連續記帳的第 ' + c.streak + ' 天。');
  return out.join('');
}
function drawCard(){
  const c = todayContext();
  const recent = new Set(Object.keys(db.cards).filter(k => daysBetween(k, c.td) <= 7).map(k => db.cards[k].id));
  const pool = [];
  CARDS.forEach(card => {
    const hit = card.tags.filter(tg => tg !== 'any' && c.tags.has(tg));
    if (!hit.length && card.tags.indexOf('any') < 0) return;
    let w = RARITY[card.r].w * (hit.length ? Math.max.apply(null, hit.map(tg => PRIORITY[tg] || 2)) : 1);
    if (recent.has(card.id)) w *= .15;
    pool.push([card, w]);
  });
  let x = Math.random() * pool.reduce((s,p) => s + p[1], 0), pick = pool[0][0];
  for (const [card, w] of pool) { x -= w; if (x <= 0) { pick = card; break; } }
  const msg = pick.m.replace(/\{streak\}/g, c.streak).replace(/\{goal\}/g, c.goal ? c.goal.g.name : '你的目標').replace(/\{goalPct\}/g, c.goal ? Math.round(c.goal.p * 100) : 80);
  return {id: pick.id, msg, reading: readingFor(c), luck: Math.floor(Math.random() * LUCKY.length), at: Date.now()};
}

function burst(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  const chars = ['✦','✧','♡','✿','⋆'];
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 110, sp = document.createElement('span');
    sp.textContent = chars[i % chars.length];
    sp.style.setProperty('--dx', Math.cos(a) * r + 'px'); sp.style.setProperty('--dy', Math.sin(a) * r + 'px');
    sp.style.animationDelay = Math.random() * .15 + 's';
    b.appendChild(sp);
  }
  document.body.appendChild(b); setTimeout(() => b.remove(), 1300);
}

      const dl = await window.claude.use('downloads');
      if (dl) {

  } catch(e) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = s => { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };

/* ---------- events ---------- */
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'fab') return openTx(null);
  view.page = b.dataset.page; render(); window.scrollTo(0,0);
});
$('gear').onclick = () => { view.page = 'settings'; render(); window.scrollTo(0,0); };
$('prevM').onclick = () => { if (--view.m < 0) { view.m = 11; view.y--; } render(); };
$('nextM').onclick = () => { if (++view.m > 11) { view.m = 0; view.y++; } render(); };
$('monthTitle').onclick = () => { const n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); render(); };
$('search').addEventListener('input', e => { view.q = e.target.value; renderList(); });
$('txList').addEventListener('click', e => {
  const b = e.target.closest('.tx'); if (!b) return;
  openTx(db.txs.find(t => t.id === b.dataset.id));
});
$('statType').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view.statType = b.dataset.v; renderStats(); } });
$('anaSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view.ana = b.dataset.v; renderAna(); } });
$('planSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view.plan = b.dataset.v; renderPlan(); } });
$('daily').addEventListener('click', () => {
  const td = todayStr();
  if (db.cards[td]) return showCard(db.cards[td], td);
  if (!db.txs.some(t => t.date === td)) return openTx(null);
  openDraw();
});

$('page-assets').addEventListener('click', e => {
  if (e.target.closest('#toGoals')) { view.page = 'plan'; view.plan = 'goals'; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('#spNewGoal')) return editGoal(null);
  const n = e.target.closest('[data-newacct]'); if (n) return editAcct(null, n.dataset.newacct);
  const p = e.target.closest('[data-pay]');
  if (p) {
    const a = findAcct(p.dataset.pay), from = db.accts.find(x => x.kind !== 'liability' && x.type === 'bank') || db.accts.find(x => x.kind !== 'liability');
    return openTx(null, {type:'transfer', acct: from && from.id, to: a.id, amount: a.monthly ? Math.min(a.monthly, bal(a)) : '', note: '還款'});
  }
  const r = e.target.closest('[data-acct]'); if (r) editAcct(findAcct(r.dataset.acct));
});
$('planBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'newGoal') return editGoal(null);
  if (t.id === 'newWish') return editWish(null);
  const d = t.dataset;
  if (d.deposit) return depositGoal(db.goals.find(g => g.id === d.deposit));
  if (d.goal) return editGoal(db.goals.find(g => g.id === d.goal));
  if (d.wish) return editWish(db.wishes.find(w => w.id === d.wish));
  if (d.buy) return buyWish(db.wishes.find(w => w.id === d.buy));
  if (d.card) { const k = Object.keys(db.cards).filter(x => db.cards[x].id === d.card).sort().pop(); if (k) showCard(db.cards[k], k); return; }
  if (d.wgoal) {
    const w = db.wishes.find(x => x.id === d.wgoal);
    return editGoal(null, {icon:'✨', name: w.name, target: w.price});
  }
});

$('mask').onclick = closeTop;
$('fCancel').onclick = () => hideSheet('sheet');
$('keypad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pressKey(b.dataset.k); });
// 電腦鍵盤也能直接輸入金額
document.addEventListener('keydown', e => {
  if (openSheets[openSheets.length - 1] !== 'sheet') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = {'Backspace':'back', 'Delete':'C', 'Enter':'ok', '=':'ok', 'x':'*', 'X':'*'};
  const k = map[e.key] || e.key;
  if (/^\d$/.test(k) || k === '.' || OPS.indexOf(k) >= 0 || k === 'back' || k === 'C' || k === 'ok') { e.preventDefault(); pressKey(k); }
});
$('fNote').addEventListener('keydown', e => { if (e.key === 'Enter') submitTx(); });
$('typeToggle').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { form.type = b.dataset.type; renderFormType(); } });
$('fCats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { form.cat = b.dataset.cat; renderFormType(); } });
$('fDelete').onclick = async () => {
  if (!await ask('確定刪除這筆紀錄？', '刪除', true)) return;
  db.txs = db.txs.filter(t => t.id !== form.id);
  save(); hideSheet('sheet'); render(); toast('已刪除');
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('drawOv').classList.contains('hidden')) closeDraw(); else closeTop(); } });

$('saveBudget').onclick = () => {
  const v = num($('budgetInput').value);
  db.budget = v > 0 ? v : 0; save(); toast(db.budget ? '每月預算設為 $' + money(db.budget) : '已取消預算');
};
document.querySelectorAll('[data-addcat]').forEach(btn => {
  btn.onclick = () => {
    const type = btn.dataset.addcat, p = type === 'expense' ? 'newExp' : 'newInc';
    const name = $(p + 'Name').value.trim(), icon = $(p + 'Icon').value.trim() || (type === 'expense' ? '🏷️' : '💰');
    if (!name) { toast('請輸入分類名稱'); return; }
    db.cats[type].push({id: uid(), name, icon});
    $(p + 'Name').value = $(p + 'Icon').value = '';
    save(); renderSettings(); toast('已新增「' + name + '」');
  };
});
$('page-settings').addEventListener('click', async e => {
  const b = e.target.closest('[data-delcat]'); if (!b) return;
  const [type, id] = b.dataset.delcat.split('|');
  if (db.cats[type].length <= 1) { toast('至少要保留一個分類'); return; }
  const used = db.txs.filter(t => t.type === type && t.cat === id).length;
  if (!await ask('刪除分類「' + findCat(type, id).name + '」？' + (used ? '\n已有 ' + used + ' 筆紀錄使用它，紀錄會保留，但會顯示為「已刪除分類」。' : ''), '刪除', true)) return;
  db.cats[type] = db.cats[type].filter(c => c.id !== id);
  save(); renderSettings();
});
$('themeSel').onchange = e => { db.theme = e.target.value; save(); applyTheme(); };
$('exportJson').onclick = () => offerFile('記帳備份-' + todayStr() + '.json', JSON.stringify(db, null, 2), 'application/json');
$('exportCsv').onclick = () => {
  const rows = [['日期','類型','分類','金額','帳戶','轉入帳戶','備註']];
  db.txs.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts).forEach(t => {
    rows.push([t.date, {expense:'支出', income:'收入', transfer:'轉帳'}[t.type], t.type === 'transfer' ? '' : findCat(t.type, t.cat).name,
      t.amount, findAcct(t.acct).name, t.type === 'transfer' ? findAcct(t.to).name : '', t.note]);
  });
  // 加 BOM 讓 Excel 正確顯示中文
  offerFile('記帳明細-' + todayStr() + '.csv', '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    e.target.value = '';
    let d;
    try { d = JSON.parse(r.result); if (!d || !Array.isArray(d.txs) || !d.cats) throw 0; }
    catch(err) { toast('這不是記帳本的備份檔'); return; }
    if (!await ask('還原會用備份中的 ' + d.txs.length + ' 筆紀錄，取代目前的 ' + db.txs.length + ' 筆。確定嗎？', '還原')) return;
    db = Object.assign(clone(DEFAULT), migrate(d));
    save(); applyTheme(); render(); toast('還原完成');
  };
  r.readAsText(f);
};
$('wipe').onclick = async () => {
  if (!await ask('清除所有紀錄、帳戶、目標和設定？\n這個動作無法復原，建議先下載備份。', '全部清除', true)) return;
  db = clone(DEFAULT); save(); applyTheme(); render(); toast('已清除');
};

applyTheme();
makeIcon();
render();
})();
</script>
</body>
</html>
